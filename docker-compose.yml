version: "3.8"

services:
  # 1. BASE DE DATOS (PostgreSQL, aislada y segura)
  reyruses_db:
    image: postgres:17
    container_name: reyruses_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: reyruses_db
      POSTGRES_USER: reyruses_user
      POSTGRES_PASSWORD: reyruses_password
    volumes:
      - reyruses_pg_data:/var/lib/postgresql/data
    networks:
      - reyruses_net

  # 2. BACKEND (Laravel API)
  reyruses_api:
    build:
      context: ./reyroses-api
    container_name: reyruses_api
    restart: unless-stopped
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: reyruses_db
      DB_PORT: 5432
      DB_DATABASE: reyruses_db
      DB_USERNAME: reyruses_user
      DB_PASSWORD: reyruses_password
    ports:
      - "9000:80" # Expuesto internamente en el puerto 9000
    depends_on:
      - reyruses_db
    networks:
      - reyruses_net

  # 3. FRONTEND (Landing Page en Vue)
  reyruses_landing:
    build:
      context: ./rey-roses-landing
    container_name: reyruses_landing
    restart: unless-stopped
    ports:
      - "9001:80" # Expuesto internamente en el puerto 9001
    networks:
      - reyruses_net

  # 4. FRONTEND (Panel Admin en Vue)
  reyruses_admin:
    build:
      context: ./admin-reyroses
    container_name: reyruses_admin
    restart: unless-stopped
    ports:
      - "9002:80" # Expuesto internamente en el puerto 9002
    networks:
      - reyruses_net

# Configuración de red y persistencia de datos
networks:
  reyruses_net:
    driver: bridge

volumes:
  reyruses_pg_data:
